name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, source-node]
    environment: source-node
    timeout-minutes: 60
    concurrency:
      group: source-node-deployment
      cancel-in-progress: false
    steps:
      - name: Check out deployment revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          clean: false
          persist-credentials: false
      - name: Attach Node-local configuration
        run: |
          ln -sfn "$HOME/.config/source/.env" .env
          rm -rf artifacts
          ln -s "$HOME/.local/share/source/artifacts" artifacts
      - name: Deploy Source
        run: ./scripts/deploy.sh
