name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, linux, source-node]
    environment: source-node
    timeout-minutes: 60
    concurrency:
      group: source-node-deployment
      cancel-in-progress: false
    steps:
      - name: Check out tested revision
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          clean: false
          persist-credentials: false
      - name: Attach Node-local configuration
        run: |
          ln -sfn "$HOME/.config/source/.env" .env
          rm -rf artifacts
          ln -s "$HOME/.local/share/source/artifacts" artifacts
      - name: Deploy Source
        run: ./scripts/deploy.sh
