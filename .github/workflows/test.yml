name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l source)"
      - name: Vet
        working-directory: source
        run: go vet ./...
      - name: Test and build
        working-directory: source
        run: |
          go test ./...
          go build ./...

  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build empty app and model packaging
        working-directory: self/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleDebug

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate pinned model manifest
        run: |
          python3 scripts/provision_models.py --check
          python3 -m unittest discover -s scripts
