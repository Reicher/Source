name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: source/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l source)"
      - name: Vet
        working-directory: source
        run: go vet ./...
      - name: Test and build
        working-directory: source
        run: |
          go test ./...
          go build ./...

  self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test and build Self app and model packaging
        working-directory: self/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:bundleDebug

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate pinned model manifest
        run: |
          python3 scripts/provision_models.py --check
          python3 -m unittest discover -s scripts

  # Keep the required check name used by main's branch protection.
  test:
    needs: [source, self, models]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every foundation job to pass
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          SELF_RESULT: ${{ needs.self.result }}
          MODELS_RESULT: ${{ needs.models.result }}
        run: |
          for result in "$SOURCE_RESULT" "$SELF_RESULT" "$MODELS_RESULT"; do
            if [ "$result" != success ]; then
              printf 'A foundation job ended with status: %s\n' "$result" >&2
              exit 1
            fi
          done
