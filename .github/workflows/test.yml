name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Check Go formatting
        working-directory: node
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "The following Go files need gofmt:" "$unformatted"
            exit 1
          fi
      - name: Vet Source Node
        working-directory: node
        run: go vet ./...
      - name: Test Source Node
        working-directory: node
        run: go test ./...
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709" "cmake;3.31.6"
      - name: Provision pinned llama.cpp
        run: ./scripts/provision-llama-cpp.sh
      - name: Test Android Source Client
        working-directory: clients/android
        run: ./gradlew app:testInstrumentedUnitTest app:lintDebug app:assembleDebug app:assembleInstrumentedAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test Android vault on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          working-directory: clients/android
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew app:connectedInstrumentedAndroidTest -PsourceAbis=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=com.source.client.security.SecureVaultDeviceTest
      - name: Validate shell scripts
        run: for script in scripts/*.sh; do sh -n "$script"; done
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
