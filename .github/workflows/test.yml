name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Test Source Node
        working-directory: node
        run: go test ./...
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test Android Source Client
        working-directory: clients/android
        run: ./gradlew app:testInstrumentedUnitTest app:lintDebug app:assembleDebug
      - name: Validate shell scripts
        run: for script in scripts/*.sh; do sh -n "$script"; done
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
