name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: node/go.mod
          cache-dependency-path: node/go.sum
      - name: Check Go formatting
        working-directory: node
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "The following Go files need gofmt:" "$unformatted"
            exit 1
          fi
      - name: Vet Source Node
        working-directory: node
        run: go vet ./...
      - name: Test Source Node
        working-directory: node
        run: go test ./...
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.1.13356709" "cmake;3.31.6"
      - name: Provision pinned llama.cpp
        run: ./scripts/provision-llama-cpp.sh
      - name: Test Android Source Client
        working-directory: clients/android
        run: ./gradlew app:testInstrumentedUnitTest app:lintDebug app:assembleDebug app:assembleInstrumentedAndroidTest
      - name: Validate shell scripts
        run: for script in scripts/*.sh; do sh -n "$script"; done
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
