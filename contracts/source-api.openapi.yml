openapi: 3.1.0
info:
  title: Source Node API
  version: 1.3.0
  description: >-
    LAN API for key-paired clients, local-model chat, and opaque encrypted
    canonical storage synchronization and transitional opaque snapshots.
    Administrative endpoints are intentionally excluded because
    they are served by the separate loopback-only admin listener.
servers:
  - url: https://{sourceNodeHost}:8443/api/v1
    description: Source Node on a trusted local network
    variables:
      sourceNodeHost:
        default: 192.168.1.10
security:
  - bearerAuth: []
paths:
  /status:
    get:
      security: []
      operationId: getStatus
      responses:
        "200":
          description: Minimal reachability and model status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /pairing/start:
    post:
      security: []
      operationId: startPairing
      description: Validate an active invitation and issue a signed proof-of-possession challenge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingStart"
      responses:
        "200":
          description: Challenge for the client Ed25519 key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingChallenge"
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /pairing/complete:
    post:
      security: []
      operationId: completePairing
      description: >-
        Verify the signature and consume the invitation. A normal invitation
        atomically creates a user/client and recovery material; an
        administrator-approved recovery invitation replaces the user's active
        clients after the recovery key is verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingCompletion"
      responses:
        "201":
          description: Paired client credential. The credential is returned once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingResult"
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /recovery/setup:
    post:
      operationId: setupRecovery
      description: Configure recovery once for a user paired before recovery support was introduced.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryMaterial" }
      responses:
        "201": { description: Recovery configured }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          description: User and client represented by the client bearer credential
          content:
            application/json:
              schema:
                type: object
                required: [user, clientId]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  clientId: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /identity/challenge:
    post:
      operationId: proveNodeIdentity
      description: >-
        Returns a fresh Ed25519 proof of the permanent Node identity, bound to
        the authenticated client and its nonce. Clients use this after DNS-SD
        rediscovery before showing the Node as connected.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeIdentityChallenge" }
      responses:
        "200":
          description: Signed Node identity proof
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeIdentityProof" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /ai/stream:
    post:
      operationId: streamAi
      description: >-
        Streams the shared Source AI v1 event contract as newline-delimited JSON.
        Only explicit user and assistant text is sent to the model; no Source
        system prompt is added. Closing the response cancels generation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SourceAiRequest" }
      responses:
        "200":
          description: Source AI events, one JSON object per line
          content:
            application/x-ndjson:
              schema:
                type: string
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /storage/{appId}/snapshots:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      operationId: listSnapshots
      responses:
        "200":
          description: Newest snapshots first
          content:
            application/json:
              schema:
                type: object
                required: [snapshots]
                properties:
                  snapshots:
                    type: array
                    items: { $ref: "#/components/schemas/Snapshot" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /storage/{appId}/snapshots/latest:
    parameters:
      - $ref: "#/components/parameters/AppId"
    get:
      operationId: getLatestSnapshot
      responses:
        "200": { $ref: "#/components/responses/SnapshotBody" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /storage/{appId}/snapshots/{snapshotId}:
    parameters:
      - $ref: "#/components/parameters/AppId"
      - $ref: "#/components/parameters/SnapshotId"
    put:
      operationId: putSnapshot
      parameters:
        - name: X-Content-SHA256
          in: header
          required: false
          schema: { type: string, pattern: "^[0-9a-fA-F]{64}$" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, minLength: 32 }
      responses:
        "201":
          description: Ciphertext stored atomically
          content:
            application/json:
              schema:
                type: object
                required: [snapshot]
                properties:
                  snapshot: { $ref: "#/components/schemas/Snapshot" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSnapshot
      responses:
        "204": { description: Ciphertext and metadata deleted }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /library/items/{itemId}:
    parameters:
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: putLibraryItem
      description: Idempotently store one opaque, client-encrypted raw Library item.
      parameters:
        - name: X-Source-Content-SHA256
          in: header
          required: true
          description: Stable SHA-256 identity of the plaintext content.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
        - name: X-Content-SHA256
          in: header
          required: true
          description: SHA-256 checksum of the encrypted request body verified by the Node.
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary, minLength: 36 }
      responses:
        "200":
          description: The identical item was already stored.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: "#/components/schemas/LibraryItem" }
        "201":
          description: The encrypted item was atomically stored.
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: "#/components/schemas/LibraryItem" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteLibraryItem
      description: Idempotently record a tombstone and remove any stored bytes.
      parameters:
        - name: X-Source-Content-SHA256
          in: header
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "204": { description: Tombstone recorded; encrypted bytes are absent. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sync/mutations/{operationId}:
    post:
      operationId: commitStorageMutation
      description: >-
        Idempotently commit one immutable revision. Identity and causal metadata
        are headers so content payloads can stream without a multipart envelope.
      parameters:
        - { name: operationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: X-Source-Contract-Version, in: header, required: true, schema: { type: integer, const: 1 } }
        - { name: X-Source-Origin-Epoch, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-Source-Origin-Sequence, in: header, required: true, schema: { type: integer, minimum: 1 } }
        - name: X-Source-Authority-Epoch
          in: header
          required: false
          description: Last reconciled authority epoch; stale values require manifest reconciliation.
          schema: { type: string, format: uuid }
        - { name: X-Source-Collection, in: header, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,63}$" } }
        - { name: X-Source-Object-Id, in: header, required: true, schema: { type: string, pattern: "^([0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-9a-f]{64})$" } }
        - { name: X-Source-Revision-Id, in: header, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: X-Source-Revision-Kind, in: header, required: true, schema: { type: string, enum: [content, tombstone] } }
        - name: X-Source-Parent-Revisions
          in: header
          required: false
          description: Sorted comma-separated lowercase revision IDs.
          schema: { type: string }
        - { name: X-Source-Payload-Format, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: X-Source-Payload-Format-Version, in: header, required: false, schema: { type: integer, minimum: 1 } }
        - { name: X-Source-Byte-Count, in: header, required: false, schema: { type: integer, minimum: 0 } }
        - { name: X-Source-Plaintext-SHA256, in: header, required: false, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
        - { name: X-Source-Created-At-Millis, in: header, required: false, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The identical operation or revision was already committed.
          content: { application/json: { schema: { $ref: "#/components/schemas/StorageCommitResult" } } }
        "201":
          description: Revision, payload, heads, and change-log position committed durably.
          content: { application/json: { schema: { $ref: "#/components/schemas/StorageCommitResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /silver/refinements:
    post:
      operationId: refineSilver
      description: >-
        Durably accept plaintext Client-originated Bronze, run refinement on the
        authoritative Node, and atomically append the resulting Node-originated
        Silver dataset revision. Repeated operations and unchanged Bronze are
        idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SilverRefinementRequest" }
      responses:
        "200":
          description: Bronze and its authoritative Silver generation already exist.
          content: { application/json: { schema: { $ref: "#/components/schemas/SilverRefinementResult" } } }
        "201":
          description: A new authoritative Silver revision was committed.
          content: { application/json: { schema: { $ref: "#/components/schemas/SilverRefinementResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /silver/removals:
    post:
      operationId: removeSilverSource
      description: >-
        Idempotently tombstone accepted Bronze refinement input and commit the
        corresponding authoritative Silver invalidation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SilverRemovalRequest" }
      responses:
        "200":
          description: The source was already absent from authoritative Silver.
          content: { application/json: { schema: { $ref: "#/components/schemas/SilverRemovalResult" } } }
        "201":
          description: The authoritative Silver invalidation was committed.
          content: { application/json: { schema: { $ref: "#/components/schemas/SilverRemovalResult" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sync/changes:
    post:
      operationId: readStorageChanges
      description: >-
        Read the accepted change log for one synchronization scope. A missing,
        stale, foreign, or rollback-epoch cursor returns the current head manifest.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageChangesRequest" }
      responses:
        "200":
          description: Scoped changes and the authoritative current heads.
          content: { application/json: { schema: { $ref: "#/components/schemas/StorageChangesResponse" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /sync/ack:
    post:
      operationId: acknowledgeStorageCursor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StorageCursorAcknowledgement" }
      responses:
        "200": { description: Cursor acknowledgement persisted idempotently. }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /sync/revisions/{revisionId}/payload:
    get:
      operationId: getStorageRevisionPayload
      parameters:
        - { name: revisionId, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
      responses:
        "200":
          description: Exact logical payload bytes named by the revision descriptor.
          headers:
            X-Source-Plaintext-SHA256: { schema: { type: string, pattern: "^[0-9a-f]{64}$" } }
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Client credential returned once by successful pairing.
  parameters:
    AppId:
      name: appId
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,31}$" }
    SnapshotId:
      name: snapshotId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: JSON error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SnapshotBody:
      description: Opaque client-encrypted snapshot
      headers:
        X-Snapshot-Id: { schema: { type: string, format: uuid } }
        X-Snapshot-Created-At: { schema: { type: string, format: date-time } }
        X-Content-SHA256: { schema: { type: string } }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
  schemas:
    SilverRefinementRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, operationId, source]
      properties:
        contractVersion: { type: integer, const: 1 }
        operationId: { type: string, format: uuid }
        source:
          type: object
          additionalProperties: false
          required: [id, name, sourceType, contentSha256, text]
          properties:
            id: { type: string, minLength: 1, maxLength: 240 }
            name: { type: string, minLength: 1, maxLength: 255 }
            sourceType: { type: string, minLength: 1, maxLength: 64 }
            contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
            text: { type: string, minLength: 1 }
    SilverRefinementResult:
      type: object
      additionalProperties: false
      required: [bronzeAccepted, refined]
      properties:
        bronzeAccepted: { type: boolean }
        refined: { type: boolean }
        receipt: { $ref: "#/components/schemas/StorageReceipt" }
    SilverRemovalRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, operationId, sourceId]
      properties:
        contractVersion: { type: integer, const: 1 }
        operationId: { type: string, format: uuid }
        sourceId: { type: string, minLength: 1, maxLength: 240 }
    SilverRemovalResult:
      type: object
      additionalProperties: false
      required: [bronzeRemoved, silverChanged]
      properties:
        bronzeRemoved: { type: boolean }
        silverChanged: { type: boolean }
        receipt: { $ref: "#/components/schemas/StorageReceipt" }
    StorageObjectKey:
      type: object
      additionalProperties: false
      required: [profileId, collection, objectId]
      properties:
        profileId: { type: string, format: uuid }
        collection: { type: string, pattern: "^[a-z][a-z0-9-]{1,63}$" }
        objectId: { type: string, pattern: "^([0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-9a-f]{64})$" }
    StoragePayload:
      type: object
      additionalProperties: false
      required: [format, formatVersion, byteCount, plaintextSha256]
      properties:
        format: { type: string, minLength: 1, maxLength: 200 }
        formatVersion: { type: integer, minimum: 1 }
        byteCount: { type: integer, minimum: 0 }
        plaintextSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
    StorageRevision:
      type: object
      additionalProperties: false
      required: [revisionId, objectKey, kind, parentRevisionIds, payload]
      properties:
        revisionId: { type: string, pattern: "^[0-9a-f]{64}$" }
        objectKey: { $ref: "#/components/schemas/StorageObjectKey" }
        kind: { type: string, enum: [content, tombstone] }
        parentRevisionIds:
          type: array
          uniqueItems: true
          items: { type: string, pattern: "^[0-9a-f]{64}$" }
        payload:
          oneOf:
            - { type: "null" }
            - { $ref: "#/components/schemas/StoragePayload" }
        createdAtMillis: { type: integer, minimum: 1 }
    StorageReceipt:
      type: object
      additionalProperties: false
      required: [operationId, revisionId, authorityNodeId, authorityEpoch, commitSequence]
      properties:
        operationId: { type: string, format: uuid }
        revisionId: { type: string, pattern: "^[0-9a-f]{64}$" }
        authorityNodeId: { type: string, pattern: "^srcnode_[A-Za-z0-9_-]{43}$" }
        authorityEpoch: { type: string, format: uuid }
        commitSequence: { type: integer, minimum: 1 }
    StorageCursor:
      type: object
      additionalProperties: false
      required: [authorityNodeId, authorityEpoch, commitSequence]
      properties:
        authorityNodeId: { type: string, pattern: "^srcnode_[A-Za-z0-9_-]{43}$" }
        authorityEpoch: { type: string, format: uuid }
        commitSequence: { type: integer, minimum: 0 }
    StorageChange:
      type: object
      additionalProperties: false
      required: [receipt, revision]
      properties:
        receipt: { $ref: "#/components/schemas/StorageReceipt" }
        revision: { $ref: "#/components/schemas/StorageRevision" }
    StorageCommitResult:
      type: object
      additionalProperties: false
      required: [contractVersion, receipt, heads]
      properties:
        contractVersion: { type: integer, const: 1 }
        receipt: { $ref: "#/components/schemas/StorageReceipt" }
        heads:
          type: array
          items: { $ref: "#/components/schemas/StorageRevision" }
    StorageChangesRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, collection, objectId]
      properties:
        contractVersion: { type: integer, const: 1 }
        collection: { type: string, pattern: "^[a-z][a-z0-9-]{1,63}$" }
        objectId: { type: string, pattern: "^([0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-9a-f]{64})$" }
        cursor: { $ref: "#/components/schemas/StorageCursor" }
    StorageChangesResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, cursor, requiresManifest, changes, heads]
      properties:
        contractVersion: { type: integer, const: 1 }
        cursor: { $ref: "#/components/schemas/StorageCursor" }
        requiresManifest: { type: boolean }
        changes:
          type: array
          items: { $ref: "#/components/schemas/StorageChange" }
        heads:
          type: array
          items: { $ref: "#/components/schemas/StorageRevision" }
    StorageCursorAcknowledgement:
      type: object
      additionalProperties: false
      required: [contractVersion, collection, objectId, cursor]
      properties:
        contractVersion: { type: integer, const: 1 }
        collection: { type: string, pattern: "^[a-z][a-z0-9-]{1,63}$" }
        objectId: { type: string, pattern: "^([0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}|[0-9a-f]{64})$" }
        cursor: { $ref: "#/components/schemas/StorageCursor" }
    SourceAiRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, runId, conversationId, messages]
      properties:
        contractVersion: { type: integer, const: 1 }
        runId: { type: string, format: uuid }
        conversationId: { type: string, minLength: 1, maxLength: 200 }
        workload: { type: string, enum: [interactive, background] }
        messages:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [role, content]
            properties:
              role: { type: string, enum: [user, assistant] }
              content:
                type: array
                minItems: 1
                maxItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [type, text]
                  properties:
                    type: { type: string, const: text }
                    text: { type: string, minLength: 1, maxLength: 4000 }
    Status:
      type: object
      additionalProperties: false
      required: [service, apiVersion, llmAvailable, ai]
      properties:
        service: { type: string, const: source-node }
        apiVersion: { type: integer, const: 1 }
        llmAvailable: { type: boolean }
        ai:
          oneOf:
            - { type: "null" }
            - $ref: "#/components/schemas/AiCapabilities"
    AiCapabilities:
      type: object
      additionalProperties: false
      required: [contractVersion, modalities, streaming, cancellation, maximumContextTokens, promptPolicy, reasoning]
      properties:
        contractVersion: { type: integer, const: 1 }
        modelId: { type: string, minLength: 1, maxLength: 200 }
        parameterCount: { type: integer, minimum: 1 }
        modalities:
          type: array
          uniqueItems: true
          items: { type: string, enum: [text, vision] }
        streaming: { type: boolean }
        cancellation: { type: boolean }
        maximumContextTokens: { type: integer, minimum: 1 }
        promptPolicy: { type: string, const: none-v1 }
        reasoning: { type: string, const: off }
    User:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 100 }
    PairingStart:
      type: object
      additionalProperties: false
      required: [protocol, invitationId, invitationSecret, clientPublicKey, userDisplayName, clientDisplayName]
      properties:
        protocol: { type: integer, const: 1 }
        invitationId: { type: string, format: uuid }
        invitationSecret: { type: string, description: One-time secret from the QR payload }
        clientPublicKey: { type: string, description: Base64url DER SubjectPublicKeyInfo for an Ed25519 key }
        userDisplayName: { type: string, minLength: 1, maxLength: 100 }
        clientDisplayName: { type: string, minLength: 1, maxLength: 100 }
    PairingChallenge:
      type: object
      additionalProperties: false
      required: [protocol, handshakeId, challenge, signingPayload, nodeSignature, expiresAt]
      properties:
        protocol: { type: integer, const: 1 }
        handshakeId: { type: string, format: uuid }
        challenge: { type: string }
        signingPayload: { type: string, description: Exact UTF-8 bytes the client signs }
        nodeSignature: { type: string, description: Ed25519 signature over signingPayload }
        expiresAt: { type: string, format: date-time }
    PairingCompletion:
      type: object
      additionalProperties: false
      required: [protocol, invitationId, invitationSecret, handshakeId, signature]
      properties:
        protocol: { type: integer, const: 1 }
        invitationId: { type: string, format: uuid }
        invitationSecret: { type: string }
        handshakeId: { type: string, format: uuid }
        signature: { type: string, description: Base64url Ed25519 signature over signingPayload }
        recoveryKey: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        recoveryEnvelope: { type: string, pattern: "^[A-Za-z0-9_-]{80}$" }
    PairingResult:
      type: object
      additionalProperties: false
      required: [protocol, nodeId, user, client, clientCredential]
      properties:
        protocol: { type: integer, const: 1 }
        nodeId: { type: string }
        user: { $ref: "#/components/schemas/User" }
        client:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string }
            displayName: { type: string, minLength: 1, maxLength: 100 }
        clientCredential: { type: string, description: Bearer credential returned once }
        recoveryEnvelope:
          type: string
          description: Returned only for recovery invitations; wraps the user's Node data key.
    RecoveryMaterial:
      type: object
      additionalProperties: false
      required: [recoveryKey, recoveryEnvelope]
      properties:
        recoveryKey: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" }
        recoveryEnvelope: { type: string, pattern: "^[A-Za-z0-9_-]{80}$" }
    NodeIdentityChallenge:
      type: object
      additionalProperties: false
      required: [protocol, nonce]
      properties:
        protocol: { type: integer, const: 1 }
        nonce: { type: string, description: Fresh 256-bit base64url client nonce }
    NodeIdentityProof:
      type: object
      additionalProperties: false
      required: [protocol, nodeId, nodePublicKey, displayName, clientId, nonce, signingPayload, nodeSignature]
      properties:
        protocol: { type: integer, const: 1 }
        nodeId: { type: string }
        nodePublicKey: { type: string, description: Base64url DER Ed25519 SubjectPublicKeyInfo }
        displayName: { type: string }
        clientId: { type: string }
        nonce: { type: string }
        signingPayload: { type: string, description: Exact UTF-8 bytes signed by the Node }
        nodeSignature: { type: string, description: Ed25519 signature over signingPayload }
    ChatMessage:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string, minLength: 1, maxLength: 4000 }
    Snapshot:
      type: object
      additionalProperties: false
      required: [id, bytes, sha256, createdAt]
      properties:
        id: { type: string, format: uuid }
        bytes: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        createdAt: { type: integer, format: int64, description: Unix epoch milliseconds }
    LibraryItem:
      type: object
      additionalProperties: false
      required: [id, contentSha256, createdAt]
      properties:
        id: { type: string, format: uuid }
        contentSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        encryptedSha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        bytes: { type: integer, minimum: 1 }
        createdAt: { type: integer, format: int64 }
        deletedAt: { type: integer, format: int64 }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
