name: source

services:
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
      args:
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
    image: source/gateway:local
    user: "${SOURCE_UID:-1000}:${SOURCE_GID:-1000}"
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
    environment:
      SOURCE_GATEWAY_HOST: ${SOURCE_GATEWAY_HOST:-127.0.0.1}
    ports:
      - "${SOURCE_BIND_IP:-127.0.0.1}:${SOURCE_HTTPS_PORT:-8443}:8443"
      # Publish administration through the gateway because Docker does not
      # publish host ports from containers attached only to internal networks.
      - "127.0.0.1:${SOURCE_ADMIN_PORT:-9090}:9090"
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SOURCE_DATA_ROOT:-./data}/gateway/data:/data
      - ${SOURCE_DATA_ROOT:-./data}/gateway/config:/config
    networks:
      - lan_edge
      - source_edge
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  node:
    build:
      context: ./node
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    image: source/node:local
    user: "${SOURCE_UID:-1000}:${SOURCE_GID:-1000}"
    restart: unless-stopped
    init: true
    environment:
      SOURCE_NODE_HOST: 0.0.0.0
      SOURCE_NODE_PORT: "8080"
      # The gateway proxies this listener to the physical host's loopback only.
      SOURCE_ADMIN_HOST: 0.0.0.0
      SOURCE_ADMIN_CONTAINER_MODE: "1"
      SOURCE_ADMIN_PORT: "9090"
      SOURCE_GATEWAY_HOST: ${SOURCE_GATEWAY_HOST:-127.0.0.1}
      SOURCE_HTTPS_PORT: ${SOURCE_HTTPS_PORT:-8443}
      SOURCE_PAIRING_CA_CERTIFICATE_PATH: /artifacts/source-node-ca.crt
      # A host-network sidecar advertises the public gateway over mDNS.
      SOURCE_DISCOVERY_ENABLED: "0"
      PAIRING_INVITATION_TTL_SECONDS: ${PAIRING_INVITATION_TTL_SECONDS:-300}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
      SOURCE_NODE_STATE_ROOT: /state
      SOURCE_NODE_STORAGE_ROOT: /vaults
      MAX_SNAPSHOT_MIB: ${MAX_SNAPSHOT_MIB:-32}
      SNAPSHOT_RETENTION_COUNT: ${SNAPSHOT_RETENTION_COUNT:-20}
      ALLOWED_STORAGE_APPS: ${ALLOWED_STORAGE_APPS:-thoughts,source-client}
      LLAMA_URL: http://llama:8080
      LLAMA_MODEL: ${LLAMA_MODEL:-source-qwen3.5-9b}
      LLAMA_MAX_OUTPUT_TOKENS: ${LLAMA_MAX_OUTPUT_TOKENS:-2048}
      LLAMA_TIMEOUT_SECONDS: ${LLAMA_TIMEOUT_SECONDS:-300}
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
    volumes:
      - ${SOURCE_DATA_ROOT:-./data}/node:/state
      - ${SOURCE_DATA_ROOT:-./data}/vaults:/vaults
      - ./artifacts:/artifacts:ro
    networks:
      - source_edge
      - inference
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  discovery:
    build:
      context: ./node
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
    image: source/node:local
    command: ["node", "src/discovery-server.mjs"]
    user: "${SOURCE_UID:-1000}:${SOURCE_GID:-1000}"
    restart: unless-stopped
    depends_on:
      node:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      SOURCE_NODE_STATE_ROOT: /state
      SOURCE_HTTPS_PORT: ${SOURCE_HTTPS_PORT:-8443}
      NODE_OPTIONS: --disable-warning=ExperimentalWarning
    volumes:
      - ${SOURCE_DATA_ROOT:-./data}/node:/state
    # mDNS multicast must originate on the physical host's LAN interface.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  llama:
    build:
      context: ./inference
      args:
        LLAMA_CPP_COMMIT: 5266f24da75dc449bd56cbed7addb9c8e4a6a73e
    image: source/llama.cpp:v0.4.0
    restart: unless-stopped
    command:
      - --model
      - /models/${LLAMA_MODEL_FILE:-Qwen_Qwen3.5-9B-Q5_K_M.gguf}
      - --alias
      - ${LLAMA_MODEL:-source-qwen3.5-9b}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "${LLAMA_CONTEXT_TOKENS:-8192}"
      - --n-predict
      - "${LLAMA_MAX_OUTPUT_TOKENS:-2048}"
      - --threads
      - "${LLAMA_THREADS:-8}"
      - --parallel
      - "1"
      - --jinja
      - --reasoning
      - "off"
    volumes:
      - ${SOURCE_DATA_ROOT:-./data}/models:/models:ro
    networks:
      - inference
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: ${LLAMA_MEMORY_LIMIT:-16g}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  # Keep one non-internal network on the gateway so Docker can publish its host
  # ports; Source services and data remain isolated on the internal networks.
  lan_edge:
  source_edge:
    internal: true
  inference:
    internal: true
