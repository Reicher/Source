<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Source Node</title><style>
:root{color-scheme:dark;--bg:#0b0f0d;--panel:#111814;--line:#294033;--text:#e6f1e9;--muted:#94a99b;--green:#70e39e;--red:#ff807a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace}main{width:min(980px,calc(100% - 32px));margin:48px auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1,h2{font-weight:600}h1{font-size:24px}h2{font-size:17px}.panel{border:1px solid var(--line);background:var(--panel);padding:24px;border-radius:8px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.metric{border-top:1px solid var(--line);padding-top:10px}.muted{color:var(--muted);font-size:12px}label{display:block;color:var(--muted);margin:14px 0 5px}input,button{font:inherit;border-radius:5px}input{width:100%;padding:11px;background:#080b09;color:var(--text);border:1px solid var(--line)}button{padding:10px 15px;border:1px solid var(--green);background:var(--green);cursor:pointer}.secondary{color:var(--text);background:transparent;border-color:var(--line)}.danger{color:var(--red);background:transparent;border-color:var(--red)}.actions{display:flex;gap:10px;margin-top:20px}.error{color:var(--red);min-height:23px}.qr{background:white;padding:12px;width:min(384px,100%)}.hidden{display:none}.user{padding:12px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
</style></head><body><main><header><h1><span style="color:var(--green)">●</span> Source Node</h1><button id="logout" class="secondary hidden">Log out</button></header><div id="screen"></div></main><script>
let csrf='',timer;const screen=document.querySelector('#screen'),logout=document.querySelector('#logout');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bytes=n=>n==null?'Unavailable':n>=1073741824?(n/1073741824).toFixed(1)+' GiB':n>=1048576?(n/1048576).toFixed(1)+' MiB':n+' B';
async function api(path,o={}){const h={...(o.body?{'content-type':'application/json'}:{}),...(csrf?{'x-source-csrf':csrf}:{}),...o.headers};const r=await fetch(path,{...o,headers:h});if(r.status===204)return null;const b=await r.json();if(!r.ok)throw new Error(b.error?.message||'Request failed');return b}
function err(e){document.querySelector('.error').textContent=e.message}
function setup(name){logout.classList.add('hidden');screen.innerHTML=`<section class="panel"><h2>Initialize this Node</h2><p class="muted">Create the permanent Node identity and local administrator login.</p><form id="form"><label>Node display name</label><input name="displayName" value="${esc(name)}" required><label>Admin password</label><input type="password" name="password" minlength="12" required><label>Confirm password</label><input type="password" name="passwordConfirmation" minlength="12" required><div class="error"></div><div class="actions"><button>Initialize</button></div></form></section>`;form.onsubmit=async e=>{e.preventDefault();try{await api('/admin/api/initialize',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});login()}catch(x){err(x)}}}
function login(){logout.classList.add('hidden');screen.innerHTML=`<section class="panel"><h2>Administrator login</h2><form id="form"><label>Admin password</label><input type="password" name="password" required><div class="error"></div><button>Log in</button></form></section>`;form.onsubmit=async e=>{e.preventDefault();try{const b=await api('/admin/api/login',{method:'POST',body:JSON.stringify({password:new FormData(form).get('password')})});csrf=b.csrfToken;dashboard()}catch(x){err(x)}}}
async function dashboard(){clearInterval(timer);logout.classList.remove('hidden');const d=await api('/admin/api/dashboard');screen.innerHTML=`<section class="panel"><h2>${esc(d.node.displayName)}</h2><div class="grid"><div class="metric">Node …${esc(d.node.fingerprint)}</div><div class="metric">Version ${esc(d.node.version)}</div><div class="metric">AI ${d.status.ai.available?'available':'unavailable'}</div><div class="metric">Storage ${bytes(d.status.disk.usedBytes)} / ${bytes(d.status.disk.totalBytes)}</div></div></section><section class="panel"><h2>Users · ${d.users.length}</h2><button id="add">Add user</button>${d.users.map(u=>`<div class="user"><span>${esc(u.displayName)} · ${bytes(u.storageUsedBytes)} / ${bytes(u.quotaBytes)}</span><span><button class="secondary recover" data-id="${u.id}" ${u.recoveryConfigured?'':'disabled'}>Recover</button> <button class="danger remove" data-id="${u.id}" data-name="${esc(u.displayName)}">Delete</button></span></div>`).join('')}</section>`;add.onclick=addUser;document.querySelectorAll('.recover').forEach(b=>b.onclick=()=>recover(b.dataset.id));document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>removeUser(b.dataset.id,b.dataset.name))}
function addUser(){screen.innerHTML=`<section class="panel"><h2>Add user</h2><form id="form"><label>Storage quota (GiB)</label><input name="quota" type="number" min="0.0625" max="16384" value="10"><div class="error"></div><button>Create pairing invitation</button></form></section>`;form.onsubmit=async e=>{e.preventDefault();try{const q=Math.round(Number(new FormData(form).get('quota'))*1073741824);pairing((await api('/admin/api/pairing-invitations',{method:'POST',body:JSON.stringify({quotaBytes:q})})).invitation)}catch(x){err(x)}}}
async function recover(id){pairing((await api(`/admin/api/users/${id}/recovery-invitations`,{method:'POST'})).invitation)}
async function removeUser(id,name){if(prompt(`Permanently delete ${name} and all Node data? Type the user name to confirm.`)!==name)return;await api(`/admin/api/users/${id}`,{method:'DELETE',body:JSON.stringify({displayName:name})});dashboard()}
function pairing(inv){screen.innerHTML=`<section class="panel"><h2>Pair user</h2><p>Waiting for a Source Client…</p><img class="qr" src="/admin/api/pairing-invitations/${inv.id}/qr.svg"><div class="error"></div><button id="cancel" class="danger">Cancel</button></section>`;timer=setInterval(async()=>{const b=await api('/admin/api/pairing-invitations/active');if(b.invitation?.state!=='active'){clearInterval(timer);dashboard()}},1000);cancel.onclick=async()=>{await api(`/admin/api/pairing-invitations/${inv.id}`,{method:'DELETE'});clearInterval(timer);dashboard()}}
logout.onclick=async()=>{try{await api('/admin/api/logout',{method:'POST'})}finally{csrf='';login()}};
(async()=>{const s=await api('/admin/api/state');csrf=s.csrfToken||'';!s.initialized?setup(s.suggestedNodeName):!s.authenticated?login():dashboard()})().catch(e=>screen.textContent=e.message);
</script></body></html>
